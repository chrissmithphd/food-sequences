[project]
name = "food-sequences"
version = "0.1.0"
description = "Study of food selection patterns in sequential purchases using the Instacart dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "kaggle>=1.6.0",
    "polars>=0.20.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "anthropic>=1.13.0",
    "sentence-transformers>=6.1.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
